<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>落ちものパズル</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fff7fb 0%, #e8f8ff 48%, #e8e5ff 100%);
      color: #4c4a68;
    }
    .game {
      display: flex;
      gap: 28px;
      align-items: center;
      padding: 22px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 22px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 24px 70px rgba(96,106,160,.2);
      backdrop-filter: blur(10px);
    }
    .board-wrap { position: relative; }
    canvas {
      display: block;
      width: min(60vw, 300px);
      height: min(120vw, 600px);
      max-height: calc(100vh - 48px);
      border: 2px solid rgba(139,143,190,.25);
      border-radius: 14px;
      background: #fbfbff;
      box-shadow: inset 0 0 30px rgba(133,142,194,.1);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      text-align: center;
      background: rgba(255,255,255,.88);
      border-radius: 14px;
    }
    .overlay.show { display: grid; }
    .overlay h2 { margin: 0 0 12px; font-size: 32px; letter-spacing: .08em; }
    .overlay p { margin: 0; color: #767392; }
    .side { width: 175px; }
    h1 { margin: 0 0 22px; font-size: 25px; line-height: 1.25; }
    .label { color: #8d89aa; font-size: 13px; letter-spacing: .12em; }
    #score { margin: 3px 0 23px; font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .controls { margin: 0; padding: 0; list-style: none; color: #676480; line-height: 1.9; font-size: 14px; }
    kbd {
      display: inline-grid;
      place-items: center;
      min-width: 27px;
      padding: 1px 6px;
      margin-right: 6px;
      border: 1px solid #bbb8d5;
      border-bottom-width: 3px;
      border-radius: 6px;
      background: #f1efff;
      color: #5d587b;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #b8a7ee, #89d8ea);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.12); }
    @media (max-width: 560px) {
      body { padding: 10px; overflow: auto; }
      .game { gap: 14px; padding: 12px; }
      .side { width: 130px; }
      h1 { font-size: 19px; margin-bottom: 14px; }
      #score { font-size: 28px; margin-bottom: 14px; }
      .controls { font-size: 12px; }
      canvas { width: min(58vw, 270px); height: min(116vw, 540px); }
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="board-wrap">
      <canvas id="board" width="300" height="600" aria-label="落ちものパズルの盤面"></canvas>
      <div id="overlay" class="overlay">
        <div><h2>GAME OVER</h2><p>もう一度ボタンで再開</p></div>
      </div>
    </div>
    <section class="side">
      <h1>落ちもの<br>パズル</h1>
      <div class="label">SCORE</div>
      <div id="score">0</div>
      <div class="label">CONTROLS</div>
      <ul class="controls">
        <li><kbd>←</kbd><kbd>→</kbd> 移動</li>
        <li><kbd>↑</kbd> 回転</li>
        <li><kbd>↓</kbd> 早く落とす</li>
        <li><kbd>Space</kbd> 一気に落とす</li>
      </ul>
      <button id="restart" type="button">もう一度遊ぶ</button>
    </section>
  </main>

  <script>
    (() => {
      'use strict';
      const COLS = 10, ROWS = 20, SIZE = 30;
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const overlay = document.getElementById('overlay');
      const COLORS = [null, '#8edff2', '#ffe394', '#c9a8ef', '#a8e6b5', '#f5a8b8', '#9ebcf4', '#ffc494'];
      const PIECES = [
        [[1,1,1,1]],
        [[2,2],[2,2]],
        [[0,3,0],[3,3,3]],
        [[0,4,4],[4,4,0]],
        [[5,5,0],[0,5,5]],
        [[6,0,0],[6,6,6]],
        [[0,0,7],[7,7,7]]
      ];

      let arena, player, score, dropCounter, lastTime, gameOver, animationId;

      function matrix(w, h) { return Array.from({length: h}, () => Array(w).fill(0)); }
      function randomPiece() { return PIECES[Math.floor(Math.random() * PIECES.length)].map(r => [...r]); }

      function resetPlayer() {
        player.matrix = randomPiece();
        player.y = 0;
        player.x = Math.floor((COLS - player.matrix[0].length) / 2);
        if (collides()) finishGame();
      }

      function collides() {
        const m = player.matrix;
        for (let y = 0; y < m.length; y++) {
          for (let x = 0; x < m[y].length; x++) {
            if (m[y][x] !== 0 && (arena[y + player.y] && arena[y + player.y][x + player.x]) !== 0) return true;
          }
        }
        return false;
      }

      function merge() {
        player.matrix.forEach((row, y) => row.forEach((value, x) => {
          if (value) arena[y + player.y][x + player.x] = value;
        }));
      }

      function clearLines() {
        let lines = 0;
        outer: for (let y = ROWS - 1; y >= 0; y--) {
          for (let x = 0; x < COLS; x++) if (arena[y][x] === 0) continue outer;
          arena.splice(y, 1);
          arena.unshift(Array(COLS).fill(0));
          y++;
          lines++;
        }
        if (lines) {
          score += [0, 100, 300, 500, 800][lines];
          scoreEl.textContent = score;
        }
      }

      function drop() {
        if (gameOver) return;
        player.y++;
        if (collides()) {
          player.y--;
          merge();
          clearLines();
          resetPlayer();
        }
        dropCounter = 0;
      }

      function move(dir) {
        player.x += dir;
        if (collides()) player.x -= dir;
      }

      function rotate() {
        const oldX = player.x;
        player.matrix = player.matrix[0].map((_, i) => player.matrix.map(row => row[i]).reverse());
        let offset = 1;
        while (collides()) {
          player.x += offset;
          offset = -(offset + (offset > 0 ? 1 : -1));
          if (Math.abs(offset) > player.matrix[0].length) {
            player.matrix = player.matrix[0].map((_, i) => player.matrix.map(row => row[row.length - 1 - i]));
            player.x = oldX;
            return;
          }
        }
      }

      function hardDrop() {
        if (gameOver) return;
        do { player.y++; } while (!collides());
        player.y--;
        merge();
        clearLines();
        resetPlayer();
        dropCounter = 0;
      }

      function roundedRect(x, y, width, height, radius) {
        ctx.beginPath();
        ctx.roundRect(x, y, width, height, radius);
      }

      function drawBlock(x, y, color) {
        const px = x * SIZE, py = y * SIZE;
        roundedRect(px + 2, py + 2, SIZE - 4, SIZE - 4, 8);
        ctx.fillStyle = color;
        ctx.fill();
        roundedRect(px + 5, py + 5, SIZE - 10, 6, 3);
        ctx.fillStyle = 'rgba(255,255,255,.38)';
        ctx.fill();
      }

      function drawMatrix(m, ox, oy) {
        m.forEach((row, y) => row.forEach((value, x) => value && drawBlock(x + ox, y + oy, COLORS[value])));
      }

      function draw() {
        ctx.fillStyle = '#fbfbff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(112,112,160,.08)';
        ctx.lineWidth = 1;
        for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x*SIZE,0); ctx.lineTo(x*SIZE,canvas.height); ctx.stroke(); }
        for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*SIZE); ctx.lineTo(canvas.width,y*SIZE); ctx.stroke(); }
        drawMatrix(arena, 0, 0);
        if (!gameOver) drawMatrix(player.matrix, player.x, player.y);
      }

      function update(time = 0) {
        const delta = time - lastTime;
        lastTime = time;
        dropCounter += delta;
        if (dropCounter > 700) drop();
        draw();
        if (!gameOver) animationId = requestAnimationFrame(update);
      }

      function finishGame() {
        gameOver = true;
        overlay.classList.add('show');
        cancelAnimationFrame(animationId);
        draw();
      }

      function start() {
        cancelAnimationFrame(animationId);
        arena = matrix(COLS, ROWS);
        player = { x: 0, y: 0, matrix: null };
        score = 0; dropCounter = 0; lastTime = performance.now(); gameOver = false;
        scoreEl.textContent = '0';
        overlay.classList.remove('show');
        resetPlayer();
        update(lastTime);
      }

      document.addEventListener('keydown', e => {
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
        if (gameOver) return;
        if (e.code === 'ArrowLeft') move(-1);
        else if (e.code === 'ArrowRight') move(1);
        else if (e.code === 'ArrowUp') rotate();
        else if (e.code === 'ArrowDown') drop();
        else if (e.code === 'Space') hardDrop();
        draw();
      });
      document.getElementById('restart').addEventListener('click', start);
      start();
    })();
  </script>
</body>
</html>
